<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>새벽 4시: 괴담 탈출!</title>
  <!-- 갈무리: 한글이 되는 무료 도트 글꼴 (SIL OFL). 인터넷이 없으면 기본 글꼴로 보인다 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">

    <!-- 시작 화면 -->
    <section id="menu-screen" class="menu">
      <!-- 언어 선택 -->
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="small" data-lang="ko">한국어</button>
        <button class="small" data-lang="en">English</button>
        <button class="small" data-lang="ja">日本語</button>
      </div>
      <p class="clock">04:00 AM</p>
      <h1 class="title" data-i18n="title">새벽 4시: 괴담 탈출!</h1>
      <p class="subtitle" data-i18n="subtitle">열쇠를 모아 출구를 열고, 괴담 신부 WKB에게 잡히기 전에 탈출하라.</p>
      <div class="menu-buttons">
        <button id="btn-start" class="primary" data-i18n="start">처음부터 시작</button>
        <button id="btn-continue" hidden>이어하기</button>
      </div>
      <p id="menu-progress" class="muted"></p>

      <div class="legend" data-i18n-aria="legend" aria-label="등장 요소 설명">
        <span><i class="dot player"></i><b data-i18n="lgMe">나</b></span>
        <span><i class="dot wkb"></i><b data-i18n="lgWkb">WKB (잡히면 끝)</b></span>
        <span><i class="dot key"></i><b data-i18n="lgKey">열쇠</b></span>
        <span><i class="dot exit"></i><b data-i18n="lgExit">출구</b></span>
        <span><i class="dot corgi"></i><b data-i18n="lgCorgi">코기블린 (-5초)</b></span>
        <span><i class="dot happy"></i><b data-i18n="lgHappy">해피 (길막·HECK!)</b></span>
      </div>

      <h2 class="section-title" data-i18n="selectStage">스테이지 선택</h2>
      <div id="stage-list"></div>

      <p class="muted help" data-i18n="help">조작: 방향키 / WASD 이동 · P 또는 Esc 일시정지 · R 재시작 · M 소리 켜기/끄기 · 모바일은 화면을 누르고 끌기 (조이스틱)</p>
      <button id="btn-reset" class="small" data-i18n="reset">진행도 초기화</button>
    </section>

    <!-- 게임 화면 -->
    <section id="game-screen" class="game" hidden>
      <header class="hud">
        <div class="hud-left">
          <div id="hud-chapter" class="hud-chapter"></div>
          <div id="hud-stage" class="hud-stage"></div>
        </div>
        <div class="hud-right">
          <span id="hud-keys" class="pill"></span>
          <span id="hud-time" class="pill"></span>
          <button id="btn-pause" class="icon-btn" data-i18n-aria="pause" aria-label="일시정지">⏸</button>
        </div>
      </header>

      <div class="board-wrap">
        <canvas id="board" data-i18n-aria="board" aria-label="게임 화면"></canvas>
        <!-- 모바일 가상 조이스틱 (반투명, 누른 자리에 나타남) -->
        <div id="joystick" class="joystick" aria-hidden="true"><div class="joy-base"><div class="joy-knob"></div></div></div>
        <div id="toast" class="toast" role="status" hidden></div>
        <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
          <div class="modal-box">
            <h2 id="modal-title"></h2>
            <p id="modal-text"></p>
            <div id="modal-buttons" class="modal-buttons"></div>
          </div>
        </div>
      </div>

    </section>

  </main>

  <!-- 소리(배경음악+효과음) 켜기/끄기 (M 키로도 가능) -->
  <button id="btn-bgm" class="icon-btn bgm-btn" aria-label="소리 끄기">🔊</button>

  <script src="js/i18n.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/bgm.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
